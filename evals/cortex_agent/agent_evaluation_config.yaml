# Cortex Agent evaluation config for CRICKET_SCORECARDS_ANALYST.
#
# No `dataset:` block on purpose — with one, every START tries to recreate
# the dataset and fails once it exists. eval_cases.sql (re)builds it, via
# run_eval.sh, whenever the cases change.
#
# agent_name and dataset_name are resolved against the session's current
# database/schema (the agent's), which run_eval.sh sets.
#
# agent_version LIVE: evaluate the draft Terraform just applied, not the
# DEFAULT version users get. Once an evaluated LIVE version is committed
# (promote_agent.sh), Snowflake relabels that run's traces with the new
# version number.

evaluation:
  agent_params:
    agent_name: "CRICKET_SCORECARDS_ANALYST"
    agent_type: "CORTEX AGENT"
    agent_version: "LIVE"
  run_params:
    label: "Cricket scorecards analyst"
    description: "Behaviour (routing, semantics, names, sources, skills, dashboards) and fixed-fact questions against SV_CRICKET_SCORECARDS"
  source_metadata:
    type: "dataset"
    dataset_name: "CRICKET_AGENT_EVALSET"

metrics:
  # Metric versions pinned so judge changes don't masquerade as agent changes.
  - name: "answer_correctness"
    version: "v3"
  - name: "logical_consistency"
    version: "v3"
  # Deterministic. Out-of-scope cases expect no tool call at all.
  - name: "tool_selection_accuracy"
    version: "v3"
