# Cortex Agent evaluation config for CRICKET_SCORECARDS_ANALYST_EVAL, the
# twin of the live agent that reads the frozen eval snapshot (fixture.sql).
#
# No `dataset:` block on purpose — with one, every START tries to recreate
# the dataset and fails once it exists. The dataset is created once by
# eval_cases.sql; bump the _V<n> suffix there and here together.
#
# agent_name and dataset_name are resolved against the session's current
# database/schema (CRICKET_SCORECARDS_EVAL), so run_eval.sql sets USE SCHEMA
# first.
#
# agent_version omitted: targets the live version while the agent has a
# single version. Pin one (e.g. VERSION$2) once versions are committed and
# runs need to be compared over time.

evaluation:
  agent_params:
    agent_name: "CRICKET_SCORECARDS_ANALYST_EVAL"
    agent_type: "CORTEX AGENT"
  run_params:
    label: "Cricket scorecards analyst"
    description: "Verified-query, held-out, and out-of-scope questions against SV_CRICKET_SCORECARDS"
  source_metadata:
    type: "dataset"
    dataset_name: "CRICKET_AGENT_EVALSET_V2"

metrics:
  # Metric versions pinned so judge changes don't masquerade as agent changes.
  - name: "answer_correctness"
    version: "v3"
  - name: "logical_consistency"
    version: "v3"
  # Deterministic. Out-of-scope cases expect no tool call at all.
  - name: "tool_selection_accuracy"
    version: "v3"
