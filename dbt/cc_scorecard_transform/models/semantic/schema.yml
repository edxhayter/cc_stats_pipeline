version: 2

models:
  - name: sv_cricket_scorecards
    description: >
      Snowflake Semantic View for Cortex Analyst, built via
      Snowflake-Labs/dbt_semantic_view (materialized='semantic_view').
      Covers the full star schema — dim_team/dim_player/dim_match/
      fact_batting/fact_bowling/fact_fow/fact_partnership/fact_fielding/
      fact_player_match_summary/fact_team_match_summary — plus Match
      Factor columns and rolling-aggregate metrics (STDDEV, all-rounder
      composite) computed here rather than in a physical mart. First pass
      validated by querying SEMANTIC_VIEW(...) directly and cross-checking
      against manually verified numbers from the Ham v Glm sample file
      (N Gubbins: 149 runs, 2 innings, average 74.5 — exact match); the
      step-8 extension (this pass) still needs the same manual
      cross-checking against Ham v Glm before treating it as validated.
