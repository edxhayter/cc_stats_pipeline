name: Agent evals

# Runs evals/cortex_agent against the deployed CRICKET_SCORECARDS_ANALYST.
# Called by deploy.yml after every production deploy; also runnable by hand
# from the Actions tab. Report-only: scores land in the job summary and as
# an artifact, and only a failed run (not a low score) fails the job.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    name: Run evals
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ORGANIZATION_NAME }}-${{ vars.SNOWFLAKE_ACCOUNT_NAME }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_CI_USER }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SEMANTIC_SCHEMA }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evals/cortex_agent/requirements.txt

      - run: pip install -r evals/cortex_agent/requirements.txt

      # To gate on score once there's a baseline, add e.g.
      # --min-answer-correctness 0.8
      - name: Run evaluation
        run: python evals/cortex_agent/run_eval.py --results-json agent_eval_results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval-results
          path: agent_eval_results.json
          if-no-files-found: ignore
